# ---------------------------------------------------------------- judging scenarios (one per pillar, multi-turn)
- id: J01
  title: Retirement facts given without a question, then a correction
  turns:
    - text: "I'm 62, I have about 350,000 dirhams saved and I spend around 9,000 a month"
      asks: monthly_income
    - text: "my pension is 4,000"
    - text: "no wait, I spend 11,000"
  pillar: knowledge
  intent: retirement_readiness
  tools: [savings_runway]
  numbers: ["350,000", "11,000", "50 months"]

- id: J02
  title: A flat-rate loan for a son's business
  turns:
    - text: "My son wants me to take a 300,000 loan for his business. The bank says 7% flat over 5 years"
      asks: monthly_income
    - text: "my pension is 12,000"
