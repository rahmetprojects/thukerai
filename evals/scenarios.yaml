# =====================================================================================================
# evals/scenarios.yaml - the 30 benchmark scenarios, as automated checks
# =====================================================================================================
# Each scenario is a short conversation. `turns` are what the person says, in order (follow-up answers
# included). For the LAST turn the evaluator checks:
#   pillar / intent       the request was understood correctly
#   asks                  (per turn, optional) the slot the assistant must ask for next - proves it asks
#                         for missing facts instead of guessing
#   tools                 calculations / checks that MUST have run (deterministic code, not the AI)
#   must_say              phrases (case-insensitive regex) that must appear in the final reply
#   must_not_say          phrases that must NOT appear (false reassurance, recommendations, guarantees)
#   numbers               numbers that must appear in the reply (proves the calculation reached the person)
#
# Run:  python -m evals.run            (offline, uses a fixture database - no network, no AI key needed)
# Data: scenarios that need CMA records use the fixture snapshot built by evals/run.py from tests/fixtures/cma
# =====================================================================================================

- id: S01
  title: Retire at 60 with AED 250,000
  turns:
    - text: "I have AED 250,000 saved. I'm 58 and want to retire at 60. Can I afford to?"
      asks: monthly_spending
    - text: "about 5,000 a month"
      asks: monthly_income
    - text: "none"
  pillar: knowledge
  intent: retirement_readiness
  tools: [savings_runway]
  numbers: ["50"]
  must_say: ["inflation"]
  must_not_say: ["you can (afford to )?retire", "you will be fine", "\\bsafe\\b"]

- id: S02
  title: Is my AED 100,000 still worth the same?
  turns:
    - text: "Prices keep going up. Is my AED 100,000 still worth the same?"
  pillar: knowledge
  intent: purchasing_power
  tools: [inflation, inflation_purchasing_power]
  must_say: ["FCSC|Federal Competitiveness", "your own costs|personal"]
  must_not_say: ["guarantee"]

- id: S03
  title: Can I live on AED 4,000 a month?
  turns:
    - text: "I receive AED 4,000 a month. Can I live on that when I retire?"
      asks: monthly_spending
    - text: "around 5,200"
  pillar: knowledge
  intent: income_sufficiency
  tools: [monthly_budget, future_cost]
  numbers: ["1,200"]

- id: S04
  title: AED 200,000 in cash and inflation
  turns:
    - text: "If I keep AED 200,000 in cash, will inflation eat my savings?"
  pillar: knowledge
  intent: purchasing_power
  tools: [inflation, deposit_vs_inflation]
  must_say: ["emergenc|accessible|need soon"]
  must_not_say: ["move (all )?your savings into"]

- id: S05
  title: Expenses AED 6,000 - how much before I stop working?
  turns:
    - text: "My expenses are AED 6,000 a month. How much should I have before I stop working?"
      asks: monthly_income
    - text: "no pension"
      asks: current_age
    - text: "I'm 59"
  pillar: knowledge
  intent: how_much_needed
  tools: [emergency_fund, retirement_capital_needed]
  numbers: ["36,000"]
  must_say: ["not the (money|amount) (needed|you need) (for|to fund)"]

